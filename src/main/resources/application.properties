# ===== Server settings =====
server.port=8080

# ===== MySQL database connection =====
# Change 'yourpassword' below to your own MySQL root password
spring.datasource.url=jdbc:mysql://localhost:3306/event_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate settings =====
# ddl-auto=update means Hibernate will automatically create/update
# the tables based on the Java entity classes (User, Event, Registration).
# This is why you do NOT have to run schema.sql manually - it's provided
# only as a reference for understanding the table structure.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
